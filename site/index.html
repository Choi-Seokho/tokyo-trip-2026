<title>도쿄 늦가을 2박 3일</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Shippori+Mincho:wght@600;800&display=swap">
<style>
/* Layout: 여행사 팸플릿. 사진 표지 → 탭 → 하루 일정표. 이동 구간은 일본 승차권(切符) 모양으로 표시 */
:root{
  --night:#14213d; --night-2:#1f3160; --ginkgo:#f2b52a; --torii:#c63d2d; --sea:#1f7a9c;
  --paper:#f3f5f8; --card:#ffffff; --ink:#1b2438; --muted:#5c6780; --line:#dde2eb; --ticket:#fff6d9; --ticket-line:#d9b85a;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --num:"Barlow Condensed","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --jp:"Shippori Mincho","Yu Mincho",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 16px/1.65 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
img{display:block;max-width:100%}
a{color:var(--sea)}
:focus-visible{outline:3px solid var(--ginkgo);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 표지 */
.cover{position:relative;background:var(--night);color:#fff;overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,21,42,.94) 0%,rgba(13,21,42,.72) 42%,rgba(13,21,42,.08) 76%)}
.cover .wrap{position:relative;z-index:1;padding-block:64px 56px}
.cover .kanji{font:800 18px/1 var(--jp);letter-spacing:.3em;color:var(--ginkgo)}
.cover h1{font:400 clamp(44px,8vw,86px)/1.08 var(--display);margin:16px 0 18px;text-wrap:balance;max-width:11em}
.cover p{font-size:clamp(16px,2vw,19px);max-width:30em;margin:0 0 26px;color:#e6eaf3}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin:0;padding:0;list-style:none}
.facts li{display:flex;flex-direction:column;min-width:0}
.facts b{font:600 13px/1.4 var(--body);color:var(--ginkgo);letter-spacing:.04em}
.facts span{font:600 clamp(20px,2.4vw,25px)/1.25 var(--num);letter-spacing:.01em}
.draft{display:inline-block;background:var(--ginkgo);color:var(--night);font:700 13px/1 var(--body);padding:7px 10px;margin-bottom:22px}

/* 탭 */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--night);box-shadow:0 2px 10px rgba(10,16,32,.28)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
.tabs button{appearance:none;border:0;background:none;color:#c7d0e4;font:600 16px/1.2 var(--body);padding:16px 18px 14px;border-bottom:4px solid transparent;cursor:pointer;white-space:nowrap;flex:1 0 auto}
.tabs button small{display:block;font:500 13px/1.2 var(--num);letter-spacing:.06em;margin-bottom:2px;color:#93a0bd}
.tabs button:hover{color:#fff}
.tabs button[aria-selected=true]{color:#fff;border-bottom-color:var(--ginkgo)}
.tabs button[aria-selected=true] small{color:var(--ginkgo)}

main{padding-block:34px 56px}
h2{font:400 clamp(28px,4vw,40px)/1.2 var(--display);margin:0;text-wrap:balance}
h3{font:400 24px/1.25 var(--display);margin:0}
.sec{margin-top:44px}
.sec-h{margin-bottom:16px}
.sec-h p{margin:6px 0 0;color:var(--muted)}

/* 한눈에 보기 */
.daycards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.daycard{appearance:none;border:0;padding:0;text-align:left;cursor:pointer;background:var(--night);color:#fff;position:relative;overflow:hidden;min-height:310px;display:flex;flex-direction:column;justify-content:flex-end;font:inherit}
.daycard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.daycard:hover img{transform:scale(1.04)}
.daycard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,21,42,.05) 25%,rgba(13,21,42,.92) 82%)}
.daycard div{position:relative;z-index:1;padding:18px}
.daycard .d{font:600 15px/1.2 var(--num);letter-spacing:.06em;color:var(--ginkgo)}
.daycard h3{margin:6px 0 6px;font-size:27px}
.daycard p{margin:0;font-size:15px;line-height:1.5;color:#e6eaf3}
.split-tag{display:inline-block;font:700 12px/1 var(--body);color:var(--night);background:var(--ginkgo);padding:5px 7px;margin-top:10px}

.mapbox{position:relative;background:var(--card);border:1px solid var(--line)}
.mapbox img{width:100%}
.pin{position:absolute;transform:translate(-50%,-50%);width:15px;height:15px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5);background:var(--c)}
.pin span{position:absolute;left:50%;bottom:calc(100% + 5px);transform:translateX(-50%);background:var(--night);color:#fff;font:600 13px/1 var(--body);padding:5px 7px;white-space:nowrap}
.pin.below span{bottom:auto;top:calc(100% + 5px)}
.pin.edge span{left:auto;right:-4px;bottom:auto;top:calc(100% + 5px);transform:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 14px;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;background:var(--c)}

.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:15px}
th,td{padding:13px 16px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
thead th{background:var(--night);color:#fff;font:600 15px/1.35 var(--body)}
tbody th{font-weight:600;color:var(--muted);white-space:nowrap}
tr:last-child>*{border-bottom:0}
.money{font:700 22px/1.2 var(--num);font-variant-numeric:tabular-nums}

.todo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.todo div{background:var(--card);border-top:4px solid var(--c,var(--torii));padding:15px 16px}
.todo b{display:block;font-weight:700;margin-bottom:4px}
.todo p{margin:0;font-size:15px;color:var(--muted)}

/* 일자 배너 */
.banner{position:relative;color:#fff;background:var(--night);overflow:hidden;min-height:310px;display:flex;align-items:flex-end}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,21,42,.08) 15%,rgba(13,21,42,.9) 88%)}
.banner>div{position:relative;z-index:1;padding:26px;max-width:760px}
.banner .d{font:600 18px/1.2 var(--num);letter-spacing:.06em;color:var(--ginkgo)}
.banner h2{font-size:clamp(32px,5vw,50px);margin:6px 0 8px}
.banner p{margin:0;color:#e6eaf3}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-top:0}
.stats div{padding:14px 18px;border-left:1px solid var(--line);min-width:0}
.stats div:first-child{border-left:0}
.stats b{display:block;font:500 13px/1.4 var(--body);color:var(--muted)}
.stats span{font:700 22px/1.25 var(--num);font-variant-numeric:tabular-nums}

.routeline{display:flex;background:var(--card);border:1px solid var(--line);border-top:0;padding:20px 12px 16px;overflow-x:auto}
.routeline div{flex:1 0 94px;position:relative;text-align:center;font-size:14px;font-weight:600;padding-top:20px;line-height:1.35}
.routeline div::before{content:"";position:absolute;top:6px;left:0;right:0;height:4px;background:var(--c,var(--torii))}
.routeline div:first-child::before{left:50%}
.routeline div:last-child::before{right:50%}
.routeline div::after{content:"";position:absolute;top:0;left:50%;margin-left:-8px;width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--c,var(--torii))}

/* 2일차 선택 */
.switch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:20px}
.switch button{appearance:none;background:var(--card);border:2px solid var(--line);padding:13px 16px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.switch button b{display:block;font:400 20px/1.3 var(--display)}
.switch button span{font-size:14px;color:var(--muted)}
.switch button[aria-pressed=true]{background:var(--night);border-color:var(--night);color:#fff}
.switch button[aria-pressed=true] span{color:#d5dcec}

/* 일정표 */
.timeline{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.stop{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start;background:var(--card);border:1px solid var(--line)}
.stop>img{width:100%;height:270px;object-fit:cover}
.stop .txt{padding:20px 22px;min-width:0}
.time{font:700 19px/1 var(--num);color:var(--torii);letter-spacing:.03em}
.stop h3{margin:7px 0 2px}
.jp{font:600 14px/1.4 var(--jp);color:var(--muted)}
.stop p{margin:9px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chips span{font-size:13px;font-weight:500;line-height:1;padding:6px 8px;background:var(--paper);color:var(--muted)}
details{margin-top:13px;border-top:1px solid var(--line)}
summary{cursor:pointer;font-weight:700;padding:11px 0 2px;color:var(--night-2)}
summary:hover{color:var(--torii)}
details ul{margin:8px 0 2px;padding-left:20px}
details li{margin:4px 0}
details .links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:14px;font-weight:600}

/* 승차권 */
.tmain{min-width:0}
.mini{grid-column:2/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px}
.mini b{font-weight:700}
.mini b.xfer{color:var(--torii)}
.pill{font-size:13px;font-weight:600;line-height:1.2;padding:5px 9px;border-radius:3px}
.route{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.leg{border-left:6px solid var(--lc);padding-left:14px;margin-left:6px}
.leg-h{display:flex;flex-wrap:wrap;gap:0 10px;align-items:baseline;margin-bottom:4px}
.leg-h span{font-size:14px;color:#6b5a2b}
.leg ol{list-style:none;margin:0;padding:0}
.leg li{position:relative;margin:0;padding:2px 0;font-size:14px;line-height:1.4}
.leg li::before{content:"";position:absolute;left:-23px;top:7px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--lc)}
.leg li.end{font-weight:700}
.leg li small{font:600 12px/1 var(--jp);color:#7a6a3c;margin-left:4px}
.transfer{background:#fff;border:1px dashed var(--torii);padding:8px 12px;font-size:14px;display:flex;flex-direction:column}
.transfer b{color:var(--torii)}

.ticket{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px 18px;background:var(--ticket);border:1px solid var(--ticket-line);padding:12px 26px;margin-inline:clamp(0px,4vw,46px)}
.ticket::before,.ticket::after{content:"";position:absolute;top:32px;width:18px;height:18px;border-radius:50%;background:var(--paper);border:1px solid var(--ticket-line)}
.ticket::before{left:-10px}.ticket::after{right:-10px}
.ticket .mk{grid-row:1/3;font:800 15px/1.1 var(--jp);color:#8c6a11;writing-mode:vertical-rl;letter-spacing:.1em;border-right:1px dashed var(--ticket-line);padding-right:13px}
.ticket .rt{font-weight:700;line-height:1.35}
.ticket .rt i{font-style:normal;color:var(--torii);padding-inline:3px}
.ticket .ln{font-size:14px;color:#6b5a2b;line-height:1.45}
.ticket .fare{text-align:right;border-left:1px dashed var(--ticket-line);padding-left:16px;white-space:nowrap}
.ticket .fare b{display:block;font:700 26px/1.05 var(--num);font-variant-numeric:tabular-nums}
.ticket .fare span{font-size:13px;color:#6b5a2b}
.ticket details{grid-column:2/-1;margin-top:0;border-top:1px dashed var(--ticket-line)}
.ticket summary{padding-top:7px;font-size:14px;color:#6b4f08}
.ticket details ul{font-size:14px}

.note{background:var(--night);color:#fff;padding:15px 18px;display:flex;gap:12px;margin-top:14px}
.note b{color:var(--ginkgo);white-space:nowrap}
.note p{margin:0;min-width:0}

.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gallery figure{margin:0;background:var(--card);border:1px solid var(--line);min-width:0}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover}
.gallery figcaption{font-size:14px;padding:8px 10px;line-height:1.4}

.shot{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);background:var(--card);border:1px solid var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top}
.shot div{padding:20px 22px;min-width:0}
.shot .tag{font:700 13px/1 var(--body);color:var(--torii)}
.shot h3{margin:8px 0 6px}
.shot p{margin:0 0 10px;font-size:15px;color:var(--muted)}

footer{background:var(--night);color:#d5dcec;font-size:14px}
footer .wrap{padding-block:28px}
footer summary{color:#fff}
footer details{border-top:1px solid #3a4a72;margin-top:12px}
footer a{color:var(--ginkgo)}
footer ul{padding-left:18px}

@media (max-width:800px){
  .daycards,.todo{grid-template-columns:minmax(0,1fr)}
  .daycard{min-height:240px}
  .stop,.shot{grid-template-columns:minmax(0,1fr)}
  .stop>img{height:210px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats div:nth-child(3){border-left:0}
  .stats div:nth-child(n+3){border-top:1px solid var(--line)}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cover::after{background:linear-gradient(180deg,rgba(13,21,42,.74),rgba(13,21,42,.9))}
  .cover .wrap{padding-block:44px 38px}
  .ticket{grid-template-columns:minmax(0,1fr) auto;padding:12px 20px;gap:10px}
  .ticket .mk{display:none}
  .mini{grid-column:1/-1}
  .ticket details{grid-column:1/-1}
  .pin span{font-size:11px;padding:3px 5px}
  .pin{width:12px;height:12px;border-width:2px}
  .switch button{padding:11px 12px}
  .switch button b{font-size:17px}
}
@media (prefers-reduced-motion:reduce){.daycard img{transition:none}}
</style>

  t.legs.forEach(l=>{ if(!l.l)return; const m=L[l.l]; mini.push(`<span class="pill" style="background:${m.c};color:${m.f}">${m.n} · ${l.m}</span>`);
    const last=stName(l.st[l.st.length-1]); mini.push(l===runs[runs.length-1]?`<b>${last}</b>`:`<b class="xfer">${last} 환승</b>`); });
  const detail=t.legs.map(l=>{
    if(l.tr)return `<div class="transfer"><b>${l.tr}</b><span>${l.note}</span></div>`;
    const m=L[l.l];
    return `<div class="leg" style="--lc:${m.c}"><div class="leg-h"><b>${m.n}</b><span>${l.dir} · ${l.m} · ${l.st.length-1}개 역</span></div><ol>${l.st.map((x,i)=>{const[a,b]=x.split('|');return `<li class="${i===0||i===l.st.length-1?'end':''}">${a} <small>${b}</small></li>`}).join('')}</ol></div>`;
  }).join('');
  const gm=`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(t.g[0])}&destination=${encodeURIComponent(t.g[1])}&travelmode=transit`;
  return `<div class="ticket"><div class="mk">乗車券</div>
  <div class="tmain"><div class="rt">${t.from}<i>→</i>${t.to}</div><div class="ln">${t.min}</div></div>
  <div class="fare"><b>${yen(t.fare)}</b><span>1인 · ${t.paper?'종이표':'IC 카드'}</span></div>
  <div class="mini">${mini.join('')}</div>
  <details><summary>역별 경로 · 환승 펼쳐보기</summary><div class="route">${detail}</div>
  ${t.more?`<ul>${t.more.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
  <div class="links"><a href="${gm}" target="_blank" rel="noopener">구글 지도로 경로 보기</a><a href="${t.src[1]}" target="_blank" rel="noopener">요금 출처: ${t.src[0]}</a></div></details></div>`;
};
const stop=s=>`<article class="stop"><img src="${IMG(s.img)}" alt="${s.title}" loading="lazy">
  <div class="txt"><div class="time">${s.time}</div><h3>${s.title}</h3><div class="jp">${s.jp}</div><p>${s.text}</p>
  <div class="chips">${s.chips.map(c=>`<span>${c}</span>`).join('')}</div>
  <details><summary>할 것 · 팁 펼쳐보기</summary><ul>${s.todo.map(x=>`<li>${x}</li>`).join('')}${(s.tips||[]).map(x=>`<li><b>참고:</b> ${x}</li>`).join('')}</ul>
  <div class="links"><a href="${maps(s.q)}" target="_blank" rel="noopener">구글 지도</a>${(s.link||[]).map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a>`).join('')}</div></details></div></article>`;

function dayView(d){
  const adm=d.admission?`<div><b>입장권 (1인)</b><span>${yen(d.admission)}</span></div>`:`<div><b>입장권</b><span>없음</span></div>`;
  return `<section class="banner"><img src="${IMG(d.img)}" alt="${d.title}"><div><div class="d">${d.no} · ${d.date}</div><h2>${d.title}</h2><p>${d.sub}</p></div></section>
  <div class="stats"><div><b>권역</b><span style="font-size:19px">${d.area}</span></div><div><b>걷기 강도</b><span>${d.walk}</span></div><div><b>이동비 (1인)</b><span>${yen(fareOf(d))}</span></div>${adm}</div>
  <div class="routeline" style="--c:${d.color}">${d.route.map(r=>`<div>${r}</div>`).join('')}</div>
  <div class="timeline">${d.items.map(i=>i.t?ticket(i.t):stop(i.s)).join('')}</div>
  <section class="sec"><div class="sec-h"><h2>참고 이미지</h2></div><div class="gallery">${d.gallery.map(g=>`<figure><img src="${IMG(g[0])}" alt="${g[1]}" loading="lazy"><figcaption>${g[1]}</figcaption></figure>`).join('')}</div></section>
  ${d.shot?`<section class="sec"><div class="sec-h"><h2>참고 화면</h2><p>예약할 때 볼 공식 사이트 화면을 이렇게 넣습니다.</p></div><div class="shot"><img src="images/shots/skyliner.jpg" alt="게이세이 스카이라이너 공식 사이트 화면" loading="lazy"><div><div class="tag">공식 사이트 캡처</div><h3>스카이라이너 예약</h3><p>요금과 시간표를 확인하고 e-티켓을 예약하는 곳입니다.</p><a href="https://www.keisei.co.jp/keisei/tetudou/skyliner/us/" target="_blank" rel="noopener">게이세이 공식 사이트 열기</a></div></div></section>`:''}`;
}
const PINS=[['나리타공항 →',139.0+1.34,35.772,'#c63d2d'],['닛포리',139.771,35.728,'#c63d2d'],['아사쿠사',139.7967,35.7148,'#c63d2d',1],['하라주쿠',139.703,35.670,'#1f7a9c'],['오다이바',139.775,35.627,'#1f7a9c',1],['디즈니씨',139.889,35.627,'#2f5bb7',1]];
function pinStyle(lon,lat){const x=Math.min(981+(lon-139.767)*1718,1975),y=456-(lat-35.681)*2109;return `left:${((x-700)/1300*100).toFixed(2)}%;top:${((y-230)/450*100).toFixed(2)}%`}
function overview(){
  const cards=[['day1',DAYS.day1,'나리타 → 아사쿠사 → 스미다 강변','야경과 밤 산책'],['day2',DAYS.odaiba,'하라주쿠·오다이바 또는 디즈니씨','두 코스 중 선택'],['day3',DAYS.day3,'야나카 → 아메요코 → 나리타','느긋한 마무리']];
  return `<h2>3일을 한눈에</h2>
  <div class="daycards">${cards.map(c=>`<button class="daycard" data-go="${c[0]}"><img src="${IMG(c[1].img)}" alt=""><div><div class="d">${c[0]==='day2'?'DAY 2':c[1].no} · ${c[1].date}</div><h3>${c[0]==='day2'?'둘째 날, 어디로?':c[1].title}</h3><p>${c[2]}</p><span class="split-tag">${c[3]}</span></div></button>`).join('')}</div>
  <section class="sec"><div class="sec-h"><h2>어디로 다니나요</h2><p>닛포리에 머물면서 도쿄 동쪽, 서쪽, 베이 지역을 하루에 한 곳씩 다닙니다.</p></div>
    <div class="mapbox"><div style="position:relative"><img src="images/map.jpg" alt="도쿄와 나리타 일대 지도">${PINS.map(p=>`<div class="pin ${p[4]?'below':''} ${p[0].includes('→')?'edge':''}" style="--c:${p[3]};${pinStyle(p[1],p[2])}"><span>${p[0]}</span></div>`).join('')}</div>
    <div class="legend"><span style="--c:#c63d2d"><i></i>1·3일차</span><span style="--c:#1f7a9c"><i></i>2일차 A</span><span style="--c:#2f5bb7"><i></i>2일차 B</span></div></div></section>
  <section class="sec"><div class="sec-h"><h2>둘째 날 코스 비교</h2></div><div class="tablewrap"><table>
    <thead><tr><th></th><th>A. 하라주쿠 + 오다이바</th><th>B. 디즈니씨</th></tr></thead><tbody>
    <tr><th>3일 총비용 (1인)</th><td><span class="money">${yen(planTotal('odaiba'))}</span></td><td><span class="money">${yen(planTotal('disney'))}</span></td></tr>
    <tr><th>체력</th><td>보통, 중간에 쉬기 쉬움</td><td>힘듦, 아침부터 밤까지 걷고 줄 서기</td></tr>
    <tr><th>볼 수 있는 곳</th><td>신사, 패션 거리, 바다 야경</td><td>디즈니씨 크리스마스 시즌</td></tr>
    <tr><th>이런 분께</th><td>도쿄를 고루 보고 싶다면</td><td>두 사람 모두 디즈니를 좋아한다면</td></tr>
    </tbody></table></div><p style="font-size:14px;color:var(--muted);margin:8px 0 0">총비용은 교통비와 입장권 합계이고, 항공·숙박·식사는 빠져 있습니다. 시내 교통은 IC 카드, 스카이라이너는 종이표 요금 기준입니다. 소요 시간은 조회 시각의 열차 기준이라 실제 출발 시각에 따라 달라집니다.</p></section>
  <section class="sec"><div class="sec-h"><h2>출발 전 준비</h2></div><div class="todo">
    <div><b>항공권</b><p>인천-나리타 왕복, 일찍 도착하고 늦게 돌아오는 편.</p></div>
    <div style="--c:var(--ginkgo)"><b>닛포리 숙소</b><p>역에서 도보 10분 안쪽, 선로와 큰길에서 떨어진 곳.</p></div>
    <div style="--c:var(--sea)"><b>스카이라이너</b><p>왕복 2인 표를 온라인으로 예약.</p></div>
  </div></section>`;
}
const TABS=[['overview','한눈에','OVERVIEW'],['day1','1일차','11.16 MON'],['day2','2일차','11.17 TUE'],['day3','3일차','11.18 WED']];
let cur='overview',plan='odaiba';
function render(){
  document.getElementById('tabs').innerHTML=TABS.map(t=>`<button role="tab" aria-selected="${cur===t[0]}" data-go="${t[0]}"><small>${t[2]}</small>${t[1]}</button>`).join('');
  let h='';
  if(cur==='overview')h=overview();
  else if(cur==='day2')h=`<div class="switch"><button data-plan="odaiba" aria-pressed="${plan==='odaiba'}"><b>A. 하라주쿠 + 오다이바</b><span>도쿄 서쪽과 바다 야경</span></button><button data-plan="disney" aria-pressed="${plan==='disney'}"><b>B. 디즈니씨</b><span>하루 종일 테마파크</span></button></div>`+dayView(DAYS[plan]);
  else h=dayView(DAYS[cur]);
  document.getElementById('view').innerHTML=h;
}
function fromHash(){
  const h=location.hash.slice(1);
  if(h==='day2-odaiba'||h==='day2-disney'){cur='day2';plan=h.slice(5)}
  else if(TABS.some(t=>t[0]===h))cur=h;
  render();
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'),p=e.target.closest('[data-plan]');
  if(g){cur=g.dataset.go;location.hash=cur==='day2'?'day2-'+plan:cur;render();document.querySelector('.tabs').scrollIntoView({block:'start'})}
  if(p){plan=p.dataset.plan;location.hash='day2-'+plan;render()}
});
window.addEventListener('hashchange',fromHash);
const CR=[['hero','Yoshikazu TAKADA','CC BY 2.0','Illuminated_Senso-ji_Temple_(4097294737).jpg'],['sensoji','Zairon','CC BY-SA 4.0','Tokio_Tempel_Senso-ji_bei_Nacht_1.jpg'],['sumida','Justin Ormont','CC BY-SA 4.0','Sumida_River_Walk_2025-12-07.jpg'],['omotesando','gog.creator','CC BY 4.0','Omotesando_Avenue_at_sunset_from_pedestrian_bridge,_Jingumae,_Shibuya,_Tokyo.jpg'],['rainbow','Syced','CC0','Rainbow_Bridge_by_night_seen_from_Odaiba_side.jpg'],['disneysea','Cabeza2000','CC BY-SA 4.0','Mediterranean_Harbor_(DisneySea)_at_Night_-_Dec_2019.jpg'],['yanaka','yeowatzup','CC BY 2.0','Yanaka_Ginza,_Tokyo,_Japan_(6790100548).jpg'],['meiji','William J Sisti','CC BY-SA 2.0','Ōtorii,_Meiji_Shrine_-_Tokyo_IMG_1103_(13002112963).jpg'],['nakamise','Bernard Spragg','Public domain','Sensō-ji._Asakusa_Tokyo._(41781495365).jpg'],['ameyoko','Maarten Heerlien','CC BY 2.0','Vibrant_Ameyoko_street_Market,_アメ横_(6156024678).jpg'],['harajuku','Syced','CC0','Marion_Crêpes_in_Harajuku_Takeshita_2.jpg']];
document.getElementById('credits').innerHTML=CR.map(c=>`<li><a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(c[3])}" target="_blank" rel="noopener">${c[0]}</a> · ${c[1]} · ${c[2]}</li>`).join('')+'<li>지도: 석호 제공 Google 지도 캡처 · 스카이라이너 화면: 게이세이 전철 공식 사이트 캡처</li>';
fromHash();
</script>
